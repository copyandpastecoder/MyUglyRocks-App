# PostgreSQL Deployment for MyUglyRocks
# Matches production setup - single instance with persistent storage
# SSL/TLS enabled for encrypted connections
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: myuglyrocks
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: myuglyrocks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate  # Required for persistent volume
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70  # postgres user in alpine image
        runAsGroup: 70
        fsGroup: 70
      initContainers:
      # Generate SSL certificates if they don't exist
      - name: generate-ssl-certs
        image: alpine:3.19
        command: ["/bin/sh", "/scripts/generate-certs.sh"]
        securityContext:
          runAsUser: 0  # Need root to run openssl and set permissions
          runAsNonRoot: false
        volumeMounts:
        - name: ssl-certs
          mountPath: /etc/postgres/ssl
        - name: ssl-config
          mountPath: /scripts
      containers:
      - name: postgres
        image: postgres:16-alpine
        args:
          - "-c"
          - "config_file=/etc/postgres/conf/postgresql.conf"
        ports:
        - containerPort: 5432
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        env:
        - name: POSTGRES_DB
          value: "myuglyrocks"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: myuglyrocks-secrets
              key: postgres-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: ssl-certs
          mountPath: /etc/postgres/ssl
          readOnly: true
        - name: postgres-conf
          mountPath: /etc/postgres/conf
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          exec:
            command:
              - pg_isready
              - -U
              - postgres
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
              - pg_isready
              - -U
              - postgres
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: ssl-certs
        emptyDir: {}
      - name: ssl-config
        configMap:
          name: postgres-ssl-config
          defaultMode: 0755
          items:
          - key: generate-certs.sh
            path: generate-certs.sh
      - name: postgres-conf
        configMap:
          name: postgres-ssl-config
          items:
          - key: postgresql.conf
            path: postgresql.conf
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: myuglyrocks
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
