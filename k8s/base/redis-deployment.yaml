# Redis Deployment for MyUglyRocks
# Used for caching - ephemeral storage is fine (cache rebuilds on restart)
# SECURITY: Authentication enabled via --requirepass from secret
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: myuglyrocks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: myuglyrocks-secrets
              key: redis-password
        command:
          - /bin/sh
          - -c
          - |
            redis-server \
              --maxmemory 128mb \
              --maxmemory-policy allkeys-lru \
              --requirepass "$REDIS_PASSWORD"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: myuglyrocks
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP
