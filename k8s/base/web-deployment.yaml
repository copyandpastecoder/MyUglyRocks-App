# Web Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myuglyrocks-web
  namespace: myuglyrocks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myuglyrocks-web
  template:
    metadata:
      labels:
        app: myuglyrocks-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: web
        image: myuglyrocks-web:latest
        imagePullPolicy: Never  # Use local image for dev
        ports:
        - containerPort: 3000
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: false  # Next.js needs writable .next
        env:
        - name: API_URL
          value: "https://10.80.80.181:30443"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: myuglyrocks-web
  namespace: myuglyrocks
spec:
  selector:
    app: myuglyrocks-web
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 30000
  type: NodePort
