# Service Account for the API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: myuglyrocks-api
  namespace: myuglyrocks
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myuglyrocks-api
  namespace: myuglyrocks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myuglyrocks-api
  template:
    metadata:
      labels:
        app: myuglyrocks-api
    spec:
      serviceAccountName: myuglyrocks-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: api
        image: myuglyrocks-api:latest
        imagePullPolicy: Never  # Use local image for dev
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: false  # .NET needs writable tmp
        env:
        # SECURITY: Use "Production" for deployed environments
        # Change to "Development" only for local debugging (enables Swagger, Hangfire dashboard)
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        # Non-secret configuration (safe as env vars)
        - name: Email__Enabled
          value: "true"
        - name: Email__BaseUrl
          value: "https://dev.myuglyrocks.com"
        # Demo user credentials for seeding
        - name: DEMO_USER_EMAIL
          valueFrom:
            secretKeyRef:
              name: myuglyrocks-api-secrets
              key: demo-user-email
              optional: true
        - name: DEMO_USER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: myuglyrocks-api-secrets
              key: demo-user-password
              optional: true
        # Secrets are mounted as files at /etc/secrets (more secure than env vars)
        # See volumeMounts below
        volumeMounts:
        - name: secrets-volume
          mountPath: /etc/secrets
          readOnly: true
        # Mount local photo folders for seeding (temporary - remove after seeding)
        - name: demo-photos
          mountPath: /demo-photos
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
            httpHeaders:
            - name: Host
              value: dev.myuglyrocks.com
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
            httpHeaders:
            - name: Host
              value: dev.myuglyrocks.com
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: secrets-volume
        secret:
          secretName: myuglyrocks-api-secrets
          defaultMode: 0400  # Read-only for owner
          items:
          # Map secret keys to .NET configuration format (__ replaces : for nested keys)
          - key: db-connection-string
            path: ConnectionStrings__DefaultConnection
          - key: redis-connection-string
            path: ConnectionStrings__Redis
          - key: jwt-secret
            path: Jwt__Secret
          - key: r2-account-id
            path: R2__AccountId
          - key: r2-access-key-id
            path: R2__AccessKeyId
          - key: r2-secret-access-key
            path: R2__SecretAccessKey
          - key: r2-bucket-name
            path: R2__BucketName
          - key: r2-public-url
            path: R2__PublicUrl
          - key: r2-backup-bucket-name
            path: R2__BackupBucketName
          - key: backup-password
            path: R2__BackupPassword
          - key: resend-api-key
            path: Email__ApiKey
          - key: gemini-api-key
            path: Gemini__ApiKey
      # Mount local photo folder for seeding (temporary - remove after seeding)
      # Docker Desktop maps D:\ to /run/desktop/mnt/host/d/
      - name: demo-photos
        hostPath:
          path: /run/desktop/mnt/host/d/DemoRockPhotos
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: myuglyrocks-api
  namespace: myuglyrocks
spec:
  selector:
    app: myuglyrocks-api
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30001
  type: NodePort
