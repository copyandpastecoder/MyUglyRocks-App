# Service Account for the API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: myuglyrocks-api
  namespace: myuglyrocks
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myuglyrocks-api
  namespace: myuglyrocks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myuglyrocks-api
  template:
    metadata:
      labels:
        app: myuglyrocks-api
    spec:
      serviceAccountName: myuglyrocks-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: api
        image: myuglyrocks-api:latest
        imagePullPolicy: Never  # Use local image for dev
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: false  # .NET needs writable tmp
        env:
        # SECURITY: Use "Production" for deployed environments
        # Change to "Development" only for local debugging (enables Swagger, Hangfire dashboard)
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        # Database
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: myuglyrocks-secrets
              key: db-connection-string
        # Redis
        - name: ConnectionStrings__Redis
          valueFrom:
            secretKeyRef:
              name: myuglyrocks-secrets
              key: redis-connection-string
        # JWT
        - name: Jwt__Secret
          valueFrom:
            secretKeyRef:
              name: myuglyrocks-secrets
              key: jwt-secret
        # R2 Storage
        - name: R2__AccountId
          valueFrom:
            secretKeyRef:
              name: myuglyrocks-secrets
              key: r2-account-id
        - name: R2__AccessKeyId
          valueFrom:
            secretKeyRef:
              name: myuglyrocks-secrets
              key: r2-access-key-id
        - name: R2__SecretAccessKey
          valueFrom:
            secretKeyRef:
              name: myuglyrocks-secrets
              key: r2-secret-access-key
        - name: R2__BucketName
          valueFrom:
            secretKeyRef:
              name: myuglyrocks-secrets
              key: r2-bucket-name
        - name: R2__PublicUrl
          valueFrom:
            secretKeyRef:
              name: myuglyrocks-secrets
              key: r2-public-url
        # Email
        - name: Email__Enabled
          value: "true"
        - name: Email__ApiKey
          valueFrom:
            secretKeyRef:
              name: myuglyrocks-secrets
              key: resend-api-key
        - name: Email__BaseUrl
          value: "https://10.80.80.181:30443"
        # Admin
        - name: ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: myuglyrocks-secrets
              key: admin-email
              optional: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: myuglyrocks-api
  namespace: myuglyrocks
spec:
  selector:
    app: myuglyrocks-api
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30001
  type: NodePort
