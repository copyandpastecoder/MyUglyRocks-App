apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myuglyrocks-ingress
  namespace: myuglyrocks
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - myuglyrocks.local
      secretName: myuglyrocks-tls
  rules:
    - host: myuglyrocks.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: myuglyrocks-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: myuglyrocks-web
                port:
                  number: 80
    # Default rule for IP-based access (no host specified)
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: myuglyrocks-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: myuglyrocks-web
                port:
                  number: 80
