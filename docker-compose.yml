services:
  akeyless-gateway:
    image: akeyless/base:latest-akeyless
    container_name: akeyless-gateway
    ports:
      - "8000:8000"   # Web UI (optional, for debugging)
      - "8081:8081"   # REST API v2
    environment:
      - ADMIN_ACCESS_ID=${AKEYLESS_ACCESS_ID}
      - ADMIN_ACCESS_KEY=${AKEYLESS_ACCESS_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./src/api
      dockerfile: MyUglyRocks.Api/Dockerfile
    container_name: myuglyrocks-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Akeyless configuration - Gateway URL and credentials
      - Akeyless__GatewayUrl=http://akeyless-gateway:8081
      - Akeyless__AccessId=${AKEYLESS_ACCESS_ID}
      - Akeyless__AccessKey=${AKEYLESS_ACCESS_KEY}
      - Akeyless__SecretPath=${AKEYLESS_SECRET_PATH:-/myuglyrocks/dev}
      # Fallback secrets for development (used if Akeyless fails)
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING:-Host=postgres;Database=myuglyrocks;Username=postgres;Password=postgres}
      - ConnectionStrings__Redis=${REDIS_CONNECTION_STRING:-redis:6379}
      - Jwt__Secret=${JWT_SECRET}
    depends_on:
      akeyless-gateway:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: myuglyrocks-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myuglyrocks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: myuglyrocks-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: